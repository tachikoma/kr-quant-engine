strategy:
  initial_cash: 10000000
  max_positions: 10
  rebalance_frequency: "M"

filters:
  min_avg_trading_value_20d: 1000000000
  min_price: 1000
  max_per: 80
  min_pbr: 0.1

ranking_weights:
  value: 0.25
  quality: 0.15
  dividend: 0.10
  momentum: 0.50

risk:
  market_filter: true
  market_ma_days: 120
  stop_loss_pct: -0.12

costs:
  buy_fee_pct: 0.00015
  sell_fee_pct: 0.00015
  sell_tax_pct: 0.0018
  slippage_pct: 0.0005

data:
  cache_dir: "data_cache"
