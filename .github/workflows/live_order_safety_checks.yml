name: Live order safety checks

on:
  pull_request:
    paths:
      - 'live_trading/etf_daily_runner.py'
      - 'live_trading/order_safety.py'
      - 'tests/test_live_order_safety.py'
      - '.github/workflows/live_order_safety_checks.yml'
  workflow_dispatch:

jobs:
  safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Static Python syntax
        run: python -m py_compile live_trading/order_safety.py live_trading/etf_daily_runner.py tests/test_live_order_safety.py
      - name: Offline safety tests (no broker credentials)
        run: python -m unittest discover -s tests -p 'test_live_order_safety.py' -v
