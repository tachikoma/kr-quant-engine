name: Live order safety checks

# 오프라인 회귀 테스트만 실행한다. 브로커 키/시크릿/.env 를 쓰지 않고 네트워크 호출도 하지 않는다.
# (테스트는 가짜 어댑터와 mock.patch 로 만든 가짜 환경변수만 사용)
on:
  pull_request:
    paths:
      - 'live_trading/**'
      - 'tests/**'
      - '.github/workflows/live_order_safety_checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install "requests>=2.28"
      - name: Static Python syntax
        run: >
          python -m py_compile
          live_trading/etf_daily_runner.py
          live_trading/broker_preflight.py
          live_trading/nh_adapter.py
          live_trading/kis_adapter.py
          live_trading/kiwoom_adapter.py
          live_trading/kb_adapter.py
          tests/test_live_order_safety_guards.py
          tests/test_broker_preflight.py
          tests/test_nh_adapter_order_status.py
      - name: Offline safety tests (no broker credentials, no network)
        run: >
          python -m unittest -v
          tests.test_live_order_safety_guards
          tests.test_broker_preflight
          tests.test_nh_adapter_order_status
